[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify's default Node can lag behind. Vite 5 needs 18+.
  # Built locally on 24; 22 is pinned here because every host supports it.
  NODE_VERSION = "22"

# No SPA catch-all redirect is needed. Most Vite guides tell you to add
# `/* /index.html 200` — that's for client-side routers. This site is one
# page and navigates with hash fragments (#log/<slug>), which never hit
# the server, so a catch-all would only mask genuine 404s.

# Vite fingerprints every asset filename, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML must never be cached, or visitors keep loading old asset names.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
